<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#18382e">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>关西晚秋 · 旅行手册</title>
  <link rel="stylesheet" href="./journey.css">
  <script defer src="./journey.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <header class="masthead">
    <div class="wrap mast-inner"><a href="?view=plan" class="brand">关西晚秋</a><span id="offline" class="offline" hidden>准备离线资料…</span></div>
  </header>
  <main id="main" class="wrap">
    <section id="locked" class="notice" aria-live="polite"><h1>关西晚秋</h1><p id="message">正在打开旅行手册…</p></section>
    <div id="trip" hidden>
      <section class="cover" aria-labelledby="title">
        <div class="cover-copy">
          <p id="trip-dates" class="dates"></p><h1 id="title" aria-label="关西 · 晚秋八日">关西<span class="title-divider"> · </span><span class="title-phrase">晚秋八日</span></h1><p>京都、宇治、大阪</p>
          <div class="cover-route" aria-label="住宿分段"><span>京都 <b>4晚</b></span><span>大阪 <b>3晚</b></span></div>
        </div>
        <figure id="cover-art" class="cover-media"></figure>
      </section>
      <nav id="views" class="views" aria-label="旅行手册栏目"></nav>
      <section id="view" aria-live="polite"></section>
    </div>
    <noscript><p>请启用 JavaScript 后打开旅行手册。</p></noscript>
  </main>
  <footer class="wrap footer">行程采用日本时间。青岛出发及抵达时间使用中国时间。</footer>
</body>
</html>
